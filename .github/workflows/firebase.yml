# Deploys the game to Firebase Hosting and the database rules on every push to main.
# It does nothing until the project is set up (README, "Launching on Firebase"):
#   repository variable FIREBASE_PROJECT   your project id, e.g. pw-auto-online-1234
#   repository secret   FIREBASE_SERVICE_ACCOUNT   the JSON key of a service account with the
#                                                  "Firebase Hosting Admin" and "Firebase Realtime Database Admin" roles
name: Deploy to Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: firebase-deploy, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT }}
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Skip until Firebase is configured
        if: env.PROJECT == '' || env.HAS_KEY != 'true'
        run: echo "FIREBASE_PROJECT / FIREBASE_SERVICE_ACCOUNT not set; nothing to deploy."
      - uses: actions/checkout@v4
        if: env.PROJECT != '' && env.HAS_KEY == 'true'
      - name: Deploy hosting and database rules
        if: env.PROJECT != '' && env.HAS_KEY == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only hosting,database --project "$PROJECT" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
