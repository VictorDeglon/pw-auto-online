# The game server in Docker: Postgres + Nakama with this module.
#   cd server/nakama && ./gen-secrets.sh > .env && docker compose up -d --build
# Both ports are published on 127.0.0.1 only. To let players in, put a TLS front in front of the game port (7350):
# Tailscale Funnel, Caddy, a cloud load balancer... then point the site's nakama.json at it. The console stays local
# (reach it over SSH: ssh -L 7351:127.0.0.1:7351 <host>).
name: pw-auto-online

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env (./gen-secrets.sh > .env)}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [db]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nakama -d nakama"], interval: 5s, timeout: 3s, retries: 30 }
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  nakama:
    build: .
    image: pw-auto-online-nakama:3.41.0
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      PG_PASSWORD: ${PG_PASSWORD:?}
      SERVER_KEY: ${SERVER_KEY:?set SERVER_KEY in .env}
      SESSION_KEY: ${SESSION_KEY:?set SESSION_KEY in .env}
      REFRESH_KEY: ${REFRESH_KEY:?set REFRESH_KEY in .env}
      HTTP_KEY: ${HTTP_KEY:?set HTTP_KEY in .env}
      CONSOLE_USER: ${CONSOLE_USER:?set CONSOLE_USER in .env}
      CONSOLE_PASSWORD: ${CONSOLE_PASSWORD:?set CONSOLE_PASSWORD in .env}
      CONSOLE_SIGNING_KEY: ${CONSOLE_SIGNING_KEY:?set CONSOLE_SIGNING_KEY in .env}
    ports:
      - "127.0.0.1:${NAKAMA_PORT:-7350}:7350"   # game API + sockets (needs a TLS front to be public)
      - "127.0.0.1:${CONSOLE_PORT:-7351}:7351"  # admin console: local only
    networks: [db, web]
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    restart: unless-stopped

networks:
  db: { internal: true }   # Postgres has no route out and no published port
  web: {}

volumes:
  pgdata: {}
